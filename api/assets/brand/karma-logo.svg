<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" width="100%" height="100%">
  <defs>
    <linearGradient id="karmaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A38"/>
      <stop offset="100%" stop-color="#D0021B"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D0021B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Circular swirl symbol -->
  <g transform="translate(10, 10)">
    <circle cx="35" cy="35" r="34" fill="url(#karmaRed)" filter="url(#subtleGlow)"/>
    <!-- Swirl cutouts -->
    <path d="M 35 11 A 24 24 0 0 1 59 35 C 59 48.2 48.2 59 35 59 C 24 59 18 51 24 43 C 28 37 36 37 38 41 C 39 43 38 46 35 46 C 31 46 29 41 33 37 C 37 33 46 36 45 42 C 44 49 34 52 28 47 C 22 42 23 27 35 21 Z" fill="#FFFFFF"/>
    <circle cx="35" cy="35" r="5" fill="url(#karmaRed)"/>
  </g>
  <!-- Brand text -->
  <text x="95" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#1E2229">KARMA</text>
  <text x="96" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4.5" fill="#E30613">ITALIANA</text>
  <!-- Badge WebApp Espositori -->
  <rect x="255" y="27" width="130" height="26" rx="6" fill="#F0F3F7"/>
  <text x="320" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#4B5563" text-anchor="middle" letter-spacing="0.5">ESPOSITORI</text>
</svg>
